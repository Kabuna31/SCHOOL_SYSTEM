{% extends "portal/base_portal.html" %}
{% block content %}
<h1>Record a Payment</h1>

<form method="post">
  {% csrf_token %}

  <label>Student:</label>
  <select name="student" required>
    <option value="">-- Select student --</option>
    {% for s in students %}
      <option value="{{ s.id }}">{{ s.admission_number }} — {{ s.full_name }}</option>
    {% endfor %}
  </select>

  <label>Amount:</label>
  <input type="number" step="0.01" min="0.01" name="amount" required>

  <label>Payment For:</label>
  <select name="paid_for">
    <option value="">-- Select --</option>
    {% for a in allocations %}
      <option value="{{ a.id }}">{{ a.name }}</option>
    {% endfor %}
  </select>

  <label>Paid Through:</label>
  <select name="paid_through">
    {% for value, label in paid_through_choices %}
      <option value="{{ value }}">{{ label }}</option>
    {% endfor %}
  </select>

  <label>Payer (name):</label>
  <input type="text" name="payer" placeholder="Parent name or other">

  <button type="submit" class="btn" style="margin-top:16px;">Save Receipt</button>
</form>
{% endblock %}
