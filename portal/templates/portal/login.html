<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login — School Management</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; }
    .wrap { max-width: 400px; margin: 80px auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.sub { margin: 0 0 24px; color: #666; font-size: 14px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #0D47A1; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #0a3577; }
    .error { background: #FFEBEE; color: #B71C1C; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .footer { text-align: center; font-size: 12px; color: #888; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>School Management</h1>
    <p class="sub">Sign in to access your dashboard</p>

    {% if messages %}
      {% for m in messages %}
        <div class="error">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign in</button>
    </form>

    <div class="footer">Forgot password? Contact your administrator.</div>
  </div>
</body>
</html>
