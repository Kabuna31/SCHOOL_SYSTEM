{% extends "admin/base_site.html" %}
{% block content %}
<h1>Reset your password</h1>
<p>Enter your email. We'll send a reset link if the address exists.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="button default">Send reset link</button>
</form>
{% endblock %}
