<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Report{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      color: #111;
      margin: 0;
      padding: 20px;
      background: #fff;
    }
    .report { max-width: 800px; margin: 0 auto; }
    .report-header {
      display: flex; align-items: center; gap: 20px;
      border-bottom: 3px solid #222; padding-bottom: 12px; margin-bottom: 20px;
    }
    .report-header .logo { max-height: 80px; }
    .school-info h1 { margin: 0 0 4px; font-size: 22px; }
    .school-info p { margin: 0; font-size: 11px; }
    .report-title {
      text-align: center; text-transform: uppercase; font-size: 16px;
      margin: 12px 0 18px;
    }
    .student-info {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px;
      margin-bottom: 18px; font-size: 12px;
    }
    .marks-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .marks-table th, .marks-table td {
      border: 1px solid #333; padding: 6px 8px; text-align: left;
    }
    .marks-table thead th { background: #eee; text-transform: uppercase; font-size: 11px; }
    .marks-table tfoot th { background: #f5f5f5; }
    .comments { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .comment-box { border: 1px solid #333; padding: 8px; min-height: 80px; }
    .report-footer {
      display: flex; justify-content: space-between; font-size: 11px;
      border-top: 1px solid #999; padding-top: 10px; margin-top: 12px;
    }

    /* Print rules */
    @media print {
      @page { size: A4; margin: 12mm; }
      body { padding: 0; font-size: 11px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
