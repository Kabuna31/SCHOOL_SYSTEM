{% extends "portal/base_portal.html" %}
{% block content %}
<h1>Bulk Report Cards</h1>
<p class="muted">Pick a class and term. One print job → all report cards.</p>

<form method="get" onsubmit="return goToCards(event);" style="margin-top:16px;">

  {% if schools %}
    <label>School:</label>
    <select id="school" onchange="window.location='/reports/bulk-pdf/?school='+this.value;">
      <option value="">-- Select school --</option>
      {% for s in schools %}
        <option value="{{ s.id }}" {% if school and s.id == school.id %}selected{% endif %}>{{ s.name }}</option>
      {% endfor %}
    </select>
    <br><br>
  {% endif %}

  <label>Class:</label>
  <select id="classroom" required {% if not classrooms %}disabled{% endif %}>
    <option value="">-- Select class --</option>
    {% for c in classrooms %}
      <option value="{{ c.id }}">{{ c }}</option>
    {% endfor %}
  </select>

  <label>Term:</label>
  <select id="term" required {% if not terms %}disabled{% endif %}>
    <option value="">-- Select term --</option>
    {% for t in terms %}
      <option value="{{ t.id }}">{{ t.name }} — {{ t.academic_year.name }}</option>
    {% endfor %}
  </select>

  <button type="submit" class="btn" style="margin-top:16px;">Open Print View</button>
</form>

<script>
function goToCards(e) {
  e.preventDefault();
  var c = document.getElementById('classroom').value;
  var t = document.getElementById('term').value;
  if (!c || !t) { alert('Pick both class and term.'); return false; }
  window.location = "/reports/bulk-pdf/" + c + "/" + t + "/";
  return false;
}
</script>
{% endblock %}
